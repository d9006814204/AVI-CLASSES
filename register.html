{% extends 'base.html' %}{% block content %}<div class="narrow"><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">JOIN THE CLASSROOM</div><h2>विद्यार्थी रजिस्ट्रेशन</h2><label>पूरा नाम</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (कम से कम 8 अक्षर)</label><input name="password" type="password" minlength="8" required><label>कक्षा चुनें</label><select name="class_no" required><option value="">कक्षा चुनें</option>{% for c in classes %}<option value="{{ c }}">कक्षा {{ c }}</option>{% endfor %}</select><button class="btn full">अकाउंट बनाएँ</button><p class="form-foot">पहले से अकाउंट है? <a href="{{ url_for('login') }}">लॉगिन करें</a></p></form></div>{% endblock %}
