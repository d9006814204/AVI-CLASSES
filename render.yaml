services:
  - type: web
    name: avi-class-tr04
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aviclasstr04.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: avi-class-tr04-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
databases:
  - name: avi-class-tr04-db
    databaseName: aviclasstr04
    user: aviclasstr04
