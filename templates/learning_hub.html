{% extends 'base.html' %}{% block content %}
<section class="office-learning">
  <div class="page-title"><div><div class="eyebrow">AVI CLASSES • OFFICE LEARNING</div><h1>Office Courses</h1><p>अपना विषय चुनें। केवल उसी विषय की सामग्री खुलेगी।</p></div><span class="class-chip">24×7 LEARNING</span></div>
