{% extends 'base.html' %}{% block content %}<div class="narrow wide"><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="eyebrow">QUESTION BUILDER</div><h2>{{ "प्रश्न संपादित करें" if q else "नया प्रश्न जोड़ें" }}</h2><div class="form-grid"><div><label>कक्षा</label><select name="class_no" required><option value="">कक्षा चुनें</option>{% for c in classes %}<option value="{{ c }}" {{ "selected" if q and q.class_no==c else "" }}>{{ c }}</option>{% endfor %}</select></div><div><label>विषय</label><select name="subject" required><option value="">विषय चुनें</option>{% for s in subjects %}<option value="{{ s }}" {{ "selected" if q and q.subject==s else "" }}>{{ s }}</option>{% endfor %}</select></div></div><label>अध्याय / Chapter</label><input name="chapter" value="{{ q.chapter if q else '' }}" placeholder="जैसे: Food, Fractions, हमारा पर्यावरण"><label>प्रश्न</label><textarea name="question" rows="3" required>{{ q.question if q else "" }}</textarea><div class="form-grid"><div><label>विकल्प A</label><input name="a" value="{{ q.a if q else '' }}" required></div><div><label>विकल्प B</label><input name="b" value="{{ q.b if q else '' }}" required></div><div><label>विकल्प C</label><input name="c" value="{{ q.c if q else '' }}" required></div><div><label>विकल्प D</label><input name="d" value="{{ q.d if q else '' }}" required></div></div><label>सही उत्तर</label><select name="answer" required><option value="">सही विकल्प चुनें</option>{% for x in ['A','B','C','D'] %}<option value="{{ x }}" {{ "selected" if q and q.answer==x else "" }}>{{ x }}</option>{% endfor %}</select><label>उत्तर का स्पष्टीकरण</label><textarea name="explanation" rows="3" >{{ q.explanation if q else "" }}</textarea><label class="check"><input type="checkbox" name="published" {{ "checked" if q and q.published else "" }}> सेव करते ही विद्यार्थियों के लिए Publish करें</label><button class="btn full">{{ "अपडेट करें" if q else "प्रश्न सेव करें" }}</button></form></div>{% endblock %}
