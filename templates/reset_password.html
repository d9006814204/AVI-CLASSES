{% extends 'base.html' %}{% block content %}
<div class="narrow"><form class="form-card" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="eyebrow">SECURE PASSWORD RESET</div><h2>नया पासवर्ड बनाएँ</h2>
<p>मोबाइल OTP सत्यापित हो चुका है। नया मजबूत पासवर्ड डालें।</p>
<label>नया पासवर्ड (कम से कम 10 अक्षर)</label><input name="new_password" type="password" minlength="10" autocomplete="new-password" required>
<label>नया पासवर्ड दोबारा डालें</label><input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required>
<button class="btn full" type="submit">पासवर्ड बदलें</button>
</form></div>{% endblock %}
